name: tyrannofi_app
description: TyrannoFi Mail Organizer — native standalone IMAP client.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^2.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  flutter_html: ^3.0.0
  share_plus: ^12.0.2
  flutter_html_table: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/logo.png
